<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body{background-image: linear-gradient(rgba(0, 0, 0, 0.452)), url(img/almacen\ 4.jpg);}
    </style>

</head>

<body class="formulario-body">

    <header>
        <div class="grabovoi">11981        419-488-71        71427321893         54121381948         91688      741         888         519-7148</div>
        <div class="contenedorheader">
            <div class="logo">
                <img src="img/RGHempaques logo 2.png" alt="logo" width="300px" height="50px">
            </div>
            <nav>
                <a href="index.html" class="encabezado">Inicio</a>
                <a href="productos.html" class="encabezado">Productos</a>
                <a href="contacto.html" class="encabezado">Contacto</a>
            </nav>
        </div>
       <hr color="black" style="height: 3px;">
    </header>
    
    <div class="formulario-container">
        <div class="formulario-header">
            <h2>Formulario de Contacto</h2>
            <p>Por favor, completa el siguiente formulario con sus datos y nosotros nos pondremos en contacto:</p>
        </div>
        <form id="cotizacion-formulario">
            <label for="nombre">Nombre:</label>
            <input type="text" name="nombre" id="nombre" required placeholder="Ingresa tu nombre completo">
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="Ingresa tu email">
            <br>
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" required minlength="10" maxlength="10" placeholder="Ingresa tu número de teléfono">
            <br>
            <label for="producto">Producto:</label>
            <input type="text" id="producto" name="producto" required placeholder="Especifica el producto que desea empaquetar" >
            <br>
            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" name="cantidad" required placeholder="Especifica la cantidad de productos a empaquetar">
            <br>
            <label for="medidas">Medidas:</label>
            <input type="text" id="medidas" name="medidas" required placeholder="Especifica las medidas del producto como largo, ancho y alto">
            <br>
            <button type="submit">Enviar</button>
        </form>
    </div>

    <script>
    document.getElementById("cotizacion-formulario").addEventListener("submit", function(event) {
        event.preventDefault();

        const nombre = document.getElementById("nombre").value.trim();
        const email = document.getElementById("email").value.trim();
        const telefono = document.getElementById("telefono").value.trim();
        const producto = document.getElementById("producto").value.trim();
        const cantidad = document.getElementById("cantidad").value.trim();
        const medidas = document.getElementById("medidas").value.trim();

        const mensaje = `Buen día, mi nombre es ${nombre}. Me gustaría empaquetar ${producto}. La cantidad es ${cantidad} y 
        las medidas son ${medidas}. Mi correo es ${email} y mi teléfono ${telefono}.`;

        const enlace = `https://wa.me/528140070095?text=${encodeURIComponent(mensaje)}`;
        window.open(enlace, "_blank", "noopener,noreferrer");
    });
</script>

</body>
</html>
