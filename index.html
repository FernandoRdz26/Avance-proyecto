<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGH empaques</title>
    <style>
        body{margin: 0;}
        header{position: sticky; top: 0; z-index: 1000;}
        .contenedorheader{display: flex; gap: 200px; align-items: center; justify-content: center;}
        nav{display: flex; gap: 30px; transition: 0.5s ease;}
        .encabezado{transition: 0.5s ease; text-decoration: none; color: black;}
        .encabezado:hover{transform: scale(1.1);}
        .imagen{display: flex; justify-content: center; width: 100vw;}
        .contacto{width: 600px; height: 300px; border-radius: 20px; background-color: rgb(238, 234, 231); margin: 0 auto; margin-top: 10px;
            display: flex; flex-direction: column; text-align: center;}
        .contacto p{margin-top: 0 auto}
        h2{font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;}

    </style>
        
</head>
<body>
    <header>
        <div class="contenedorheader">
            <div class="logo">
                <img src="img/RGHempaques logo 2.png" alt="logo" width="300px" height="50px">
            </div>
            <nav>
                <a href="" class="encabezado">Inicio</a>
                <a href="" class="encabezado">¿Quienes somos?</a>
                <a href="" class="encabezado">Productos</a>
            </nav>
        </div>
       <hr color="black">
    </header>
    
    <div class="imagen">
        <img src="img/almacen1.jpeg" alt="almacen" width="33.333%" height="350px">
        <img src="img/almacen2.webp" alt="almacen" width="33.333%" height="350px">
        <img src="img/almacen 3.jpg" alt="almacen" width="33.333%" height="350px">
    </div>

    <div class="contacto">
         <h2>¿Quienes somos?</h2>
         <p>RGH Empaques & Productos de Embalaje es una empresa mexicana fundada en 2020, especializada en la fabricación y comercialización de cajas de cartón y 
            materiales de empaque.</p>
    </div>

</body>
</html>
